[project]
name = "dedutive"
version = "0.2.0"
description = "A configurable multi-agent IT troubleshooting orchestration architecture."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
dedutive = "dedutive.cli:main"
rca-bench = "deductive_rca_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dedutive", "deductive_rca_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
